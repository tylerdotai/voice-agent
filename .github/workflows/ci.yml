name: CI

on:
  push:
    branches: [voice-agent-build, main]
  pull_request:
    branches: [voice-agent-build, main]

permissions:
  contents: read

jobs:
  checks:
    name: Static and packaging checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Python syntax check
        run: |
          set -euo pipefail
          files=$(git ls-files '*.py')
          if [ -n "$files" ]; then
            python -m py_compile $files
          fi

      - name: PII handler smoke test
        run: |
          set -euo pipefail
          python - <<'PY'
          from pii_handler import redact_pii

          redacted, findings = redact_pii("Email alice@example.com or call 555-123-4567")
          assert "alice@example.com" not in redacted
          assert "555-123-4567" not in redacted
          assert {item["type"] for item in findings} >= {"email", "phone"}
          PY

      - name: Shell script syntax check
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n update.sh
          bash -n scripts/detect_hardware.sh
          bash -n scripts/backup_config.sh
          bash -n scripts/restore_config.sh

      - name: Docker Compose config validation
        env:
          LIVEKIT_KEYS: devkey:ci-only-placeholder
          LIVEKIT_SECRET: ci-only-placeholder
        run: |
          set -euo pipefail
          docker compose config --quiet

      - name: Docker image build
        run: docker build --tag voice-agent:ci .

      - name: Secret pattern scan
        run: |
          set -euo pipefail
          if git grep -n -E '(rootsecret|devkey,secret|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----)' -- . ':!.github/workflows/ci.yml'; then
            echo "Potential committed secret detected."
            exit 1
          fi
